name: Update GitHub Activity
on:
  schedule:
    - cron: "*/30 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: TheDanniCraft/activity-log@v1
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_STYLE: HTML
